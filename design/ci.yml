# CI workflow for agent-tools.
#
# NOTE: `.github/` is listed in `.agentreadonly`, so an agent cannot write this to
# its real location. Move it to `.github/workflows/ci.yml`, replacing the existing
# file.
#
# Structure follows the test tiers in ADR-011, split by prerequisite so that a
# missing capability fails one job with a clear name rather than blocking
# everything:
#
#   verify       tiers 1-2. No bwrap, no sshd. Must always pass.
#   fail-closed  bubblewrap installed, user namespaces left DENIED. Asserts a host
#                that cannot be sandboxed is refused (ENV-005) — the case that
#                could not be reproduced in development.
#   sandbox      user namespaces enabled, sshd running. Tiers 3-4.
#
# The previous single-job version failed at the bwrap smoke test: GitHub's
# ubuntu-latest is 24.04, which sets kernel.apparmor_restrict_unprivileged_userns=1
# and denies unprivileged namespaces to unconfined binaries. The `diagnose` step
# below records the actual state so this is confirmed rather than assumed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tiers 1-2: everything that needs no sandbox and no network peer.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Dependency boundaries (ADR-011)
        run: npm run check:boundaries

      - name: Tests (tiers 1-2)
        run: npm test
        env:
          AGENT_TOOLS_TEST_TIERS: '1,2'

  # Records what this runner actually permits. Never fails the build — its job is
  # to make the environment legible in the log, so a future change in runner
  # behaviour is visible rather than mysterious.
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Sandbox capability of this runner
        continue-on-error: true
        run: |
          echo "::group::kernel settings"
          sysctl kernel.unprivileged_userns_clone 2>&1 || echo "(sysctl not present)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || echo "(sysctl not present)"
          cat /proc/sys/user/max_user_namespaces 2>&1 || true
          echo "::endgroup::"

          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

          echo "::group::bwrap attempt"
          if bwrap --ro-bind / / --unshare-net true; then
            echo "RESULT: unprivileged user namespaces ARE permitted"
          else
            echo "RESULT: bwrap present but namespace DENIED (exit $?)"
          fi
          echo "::endgroup::"

  # ENV-005. The runner in its default state is the hardened host we could not
  # reproduce in development: bwrap installed, namespaces refused. Assert that
  # such a host is refused outright, with no unsandboxed fallback.
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install bubblewrap, leaving namespaces denied
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Skip if this runner permits namespaces after all
        id: check
        run: |
          if bwrap --ro-bind / / --unshare-net true 2>/dev/null; then
            echo "denied=false" >> "$GITHUB_OUTPUT"
            echo "This runner permits namespaces; the fail-closed case cannot be tested here."
          else
            echo "denied=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert a host that cannot be sandboxed is refused
        if: steps.check.outputs.denied == 'true'
        run: npm test
        env:
          AGENT_TOOLS_TEST_TIERS: '1'
          AGENT_TOOLS_EXPECT_NO_SANDBOX: '1'

  # Tiers 3-4: real bwrap and real sshd.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap ripgrep

      - name: Permit unprivileged user namespaces
        run: |
          # Ubuntu 24.04 denies these to unconfined binaries by default. Both knobs
          # are attempted because which one exists depends on the kernel.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

          # Fail loudly if the sandbox still cannot be created: ADR-006 is
          # fail-closed, and a silently skipped tier 3 would be worse than a
          # red build.
          bwrap --ro-bind / / --unshare-net true

      - name: Set up passwordless SSH to localhost for tier 4
        run: |
          sudo systemctl start ssh || sudo service ssh start
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519_agent_tools
          cat ~/.ssh/id_ed25519_agent_tools.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519_agent_tools -o BatchMode=yes -o StrictHostKeyChecking=no localhost true

      - name: Tests (tiers 3-4)
        run: npm test
        env:
          AGENT_TOOLS_TEST_TIERS: '1,2,3,4'
          AGENT_TOOLS_TEST_SSH_KEY: /home/runner/.ssh/id_ed25519_agent_tools
